[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disc-goblin"
version = "0.1.0"
description = "Automatic MakeMKV ripping appliance with safe Plex/Jellyfin naming"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Trevor" }]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pyudev>=0.24,<1; sys_platform == 'linux'",
  "PyYAML>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
disc-goblin = "disc_goblin.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/disc_goblin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
