name: disc-goblin

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-disc_goblin}"
      POSTGRES_USER: "${POSTGRES_USER:-disc_goblin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
    volumes:
      - disc-goblin-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20

  disc-goblin:
    build:
      context: .
    image: disc-goblin:local
    container_name: disc-goblin
    restart: unless-stopped
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DISC_GOBLIN_PORT:-8080}:8080"
    environment:
      DISC_GOBLIN_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-disc_goblin}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-disc_goblin}"
      DISC_GOBLIN_AUTO_RIP: "${DISC_GOBLIN_AUTO_RIP:-true}"
      DISC_GOBLIN_AUTO_PUBLISH_CONFIDENCE: "${DISC_GOBLIN_AUTO_PUBLISH_CONFIDENCE:-0.88}"
      DISC_GOBLIN_EJECT_ON_SUCCESS: "${DISC_GOBLIN_EJECT_ON_SUCCESS:-true}"
      DISC_GOBLIN_MAKEMKV_KEY: "${DISC_GOBLIN_MAKEMKV_KEY:-}"
      DISC_GOBLIN_MAX_CONCURRENT_RIPS: "${DISC_GOBLIN_MAX_CONCURRENT_RIPS:-2}"
      DISC_GOBLIN_MIN_TITLE_SECONDS: "${DISC_GOBLIN_MIN_TITLE_SECONDS:-1200}"
      DISC_GOBLIN_POLL_INTERVAL: "${DISC_GOBLIN_POLL_INTERVAL:-8}"
      DISC_GOBLIN_RIP_MODE: "${DISC_GOBLIN_RIP_MODE:-smart}"
      DISC_GOBLIN_TMDB_TOKEN: "${DISC_GOBLIN_TMDB_TOKEN:-}"
      DISC_GOBLIN_UDEV_DISCOVERY: "${DISC_GOBLIN_UDEV_DISCOVERY:-true}"
      DISC_GOBLIN_FIRMWARE_AUDIT: "${DISC_GOBLIN_FIRMWARE_AUDIT:-true}"
      DISC_GOBLIN_AUTO_FLASH: "${DISC_GOBLIN_AUTO_FLASH:-false}"
      DISC_GOBLIN_MOVIE_ROOT: "${DISC_GOBLIN_MOVIE_ROOT:-/media/library/Movies}"
      DISC_GOBLIN_TV_ROOT: "${DISC_GOBLIN_TV_ROOT:-/media/library/TV}"
    volumes:
      - ./config:/config
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - type: bind
        source: "${DISC_GOBLIN_LIBRARY_HOST_PATH:-./library}"
        target: /media/library
    # MakeMKV discovers both /dev/sr* block devices and their /dev/sg* SCSI
    # generic partners. See docs/DEPLOYMENT.md for a least-privilege override.

volumes:
  disc-goblin-postgres:
